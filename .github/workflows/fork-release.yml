# Fork releases: Windows x64 and Linux x64 builds of each upstream nightly with this fork's features
# merged in.
#
# The desktop app looks for updates in the repository it was built in (GITHUB_REPOSITORY ends up
# in app-update.yml), so a build from here keeps updating from here and the update button never
# trades the fork for a plain upstream build. Upstream's release.yml needs runners and secrets a
# fork does not have; this builds only what this fork's installs need. Both platforms share one
# release and version, so a fork client and a fork server on the other OS update in step.
#
# Each build is collin/main merged with the commit of upstream's newest nightly, so the fork
# follows upstream release by release. GitHub cannot wake a fork when upstream publishes (and npm
# registry hooks are gone), and scheduled runs in a fork fire hours late or not at all. So
# fork/upstream-nightly-watcher, a Cloudflare Worker, checks every minute and sends
# repository_dispatch once per new upstream nightly; the cron is only a fallback. Every trigger
# builds only when that nightly or collin/main is new.
# Nothing is pushed to a branch. Claude Code resolves a merge conflict for the build only
# (fork/resolve-conflicts.sh, with the ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN secret);
# collin/main itself is still synced by fork/sync.sh. When Claude cannot resolve it, the run fails
# (and GitHub mails the owner): then sync collin/main by hand.
name: Fork release
# The watcher reads this title to dispatch each upstream nightly only once.
run-name: ${{ github.event.client_payload.upstream_tag && format('Fork release of {0}', github.event.client_payload.upstream_tag) || 'Fork release' }}

on:
  repository_dispatch:
    types: [upstream-nightly]
  push:
    branches: [collin/main]
  schedule:
    # Fallback for a missed or failed dispatch. A run without a new upstream nightly or fork
    # commit ends after two API calls.
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if nothing changed since the last release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fork-release
  cancel-in-progress: false

env:
  FORK_BRANCH: collin/main
  UPSTREAM_URL: https://github.com/pingdotgg/t3code.git
  GH_TOKEN: ${{ github.token }}

jobs:
  prepare:
    if: github.repository != 'pingdotgg/t3code'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      due: ${{ steps.due.outputs.due }}
      fork_sha: ${{ steps.refs.outputs.fork_sha }}
      upstream_sha: ${{ steps.refs.outputs.upstream_sha }}
      upstream_tag: ${{ steps.refs.outputs.upstream_tag }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Find the newest upstream nightly and fork commit
        id: refs
        run: |
          set -euo pipefail
          upstream_tag=$(gh release list --repo pingdotgg/t3code --limit 30 --exclude-drafts \
            --json tagName,publishedAt \
            --jq '[.[] | select(.tagName | test("-nightly\\."))] | sort_by(.publishedAt) | last | .tagName')
          upstream_sha=$(git ls-remote "$UPSTREAM_URL" "refs/tags/$upstream_tag^{}" "refs/tags/$upstream_tag" | sort -k2 -r | head -n 1 | cut -f1)
          fork_sha=$(git ls-remote "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "refs/heads/$FORK_BRANCH" | cut -f1)
          [[ -n "$upstream_tag" && -n "$upstream_sha" && -n "$fork_sha" ]]
          echo "Upstream $upstream_tag ($upstream_sha), fork $fork_sha"
          echo "upstream_tag=$upstream_tag" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          echo "fork_sha=$fork_sha" >> "$GITHUB_OUTPUT"

      - name: Skip when the last release has the same commits
        id: due
        env:
          FORCE: ${{ inputs.force || false }}
          FORK_SHA: ${{ steps.refs.outputs.fork_sha }}
          UPSTREAM_SHA: ${{ steps.refs.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          last=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName // ""')
          body=""
          if [[ -n "$last" ]]; then
            body=$(gh release view "$last" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          fi
          if [[ "$FORCE" != "true" && "$body" == *"fork=$FORK_SHA upstream=$UPSTREAM_SHA "* ]]; then
            echo "$last already has fork $FORK_SHA and upstream $UPSTREAM_SHA."
            echo "due=false" >> "$GITHUB_OUTPUT"
          else
            echo "due=true" >> "$GITHUB_OUTPUT"
          fi

      # Plain git, as in release-desktop.yml: checkout's cleanup trips over the vendored .repos gitlinks.
      - name: Merge upstream into the fork
        id: merge
        if: steps.due.outputs.due == 'true'
        env:
          GIT_TERMINAL_PROMPT: "0"
          FORK_SHA: ${{ steps.refs.outputs.fork_sha }}
          UPSTREAM_SHA: ${{ steps.refs.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          git init -q .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git remote add upstream "$UPSTREAM_URL"
          git fetch -q --no-tags origin "$FORK_SHA"
          git fetch -q --no-tags upstream "$UPSTREAM_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout -q --detach "$FORK_SHA"
          if git merge -q --no-edit -m "Merge upstream ${UPSTREAM_SHA:0:12}" "$UPSTREAM_SHA"; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U | sed 's/^/::warning::conflict: /'
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      # One resolution per fork/upstream pair: a failed build leaves the pair due again on every run,
      # and a retry must neither pay for nor re-roll the resolution. force asks Claude again.
      - name: Restore an earlier resolution of these commits
        id: earlier
        if: steps.merge.outputs.conflict == 'true' && !inputs.force
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/resolution
          key: fork-merge-${{ steps.refs.outputs.fork_sha }}-${{ steps.refs.outputs.upstream_sha }}

      - name: Resolve conflicts with Claude
        if: steps.merge.outputs.conflict == 'true' && steps.earlier.outputs.cache-hit != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DISABLE_AUTOUPDATER: "1"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
          FORK_SHA: ${{ steps.refs.outputs.fork_sha }}
          UPSTREAM_SHA: ${{ steps.refs.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          [[ -n "$ANTHROPIC_API_KEY" ]] || unset ANTHROPIC_API_KEY
          [[ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]] || unset CLAUDE_CODE_OAUTH_TOKEN
          if [[ -z "${ANTHROPIC_API_KEY:-}${CLAUDE_CODE_OAUTH_TOKEN:-}" ]]; then
            echo "::error::upstream no longer merges cleanly into $FORK_BRANCH and neither ANTHROPIC_API_KEY nor CLAUDE_CODE_OAUTH_TOKEN is set; sync it by hand"
            exit 1
          fi
          resolution="$RUNNER_TEMP/resolution"
          mkdir -p "$resolution"
          npm install -g --silent @anthropic-ai/claude-code@2.1.306
          # The script of this workflow's commit, which differs from collin/main's on a dispatch from a branch.
          git fetch -q --no-tags origin "$GITHUB_SHA"
          git show "$GITHUB_SHA:fork/resolve-conflicts.sh" > "$RUNNER_TEMP/resolve-conflicts.sh"
          if bash "$RUNNER_TEMP/resolve-conflicts.sh"; then
            git bundle create -q "$resolution/merge.bundle" HEAD "^$FORK_SHA" "^$UPSTREAM_SHA"
          else
            touch "$resolution/failed"
          fi

      - name: Remember the resolution
        if: steps.merge.outputs.conflict == 'true' && steps.earlier.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/resolution
          key: fork-merge-${{ steps.refs.outputs.fork_sha }}-${{ steps.refs.outputs.upstream_sha }}

      - name: Apply the resolution
        if: steps.merge.outputs.conflict == 'true'
        env:
          CACHE_HIT: ${{ steps.earlier.outputs.cache-hit }}
        run: |
          set -euo pipefail
          resolution="$RUNNER_TEMP/resolution"
          if [[ -f "$resolution/failed" ]]; then
            echo "::error::Claude could not resolve the conflicts with upstream (see the first run of these commits); sync $FORK_BRANCH by hand, or rerun with force"
            exit 1
          fi
          if [[ "$CACHE_HIT" == "true" ]]; then
            git merge --abort
            git fetch -q --no-tags "$resolution/merge.bundle"
            git -c checkout.workers=0 checkout -q --detach FETCH_HEAD
          fi
          git log -1 --format='Merge %H'

      # The merge commit differs per job (timestamps) and a resolution must not be re-rolled, so the
      # build jobs check out this exact commit. The sha file keeps the artifact non-empty when
      # the merge is a plain fork or upstream commit, which they fetch anyway.
      - name: Bundle the merge
        if: steps.due.outputs.due == 'true'
        env:
          FORK_SHA: ${{ steps.refs.outputs.fork_sha }}
          UPSTREAM_SHA: ${{ steps.refs.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/merge"
          merge_sha=$(git rev-parse HEAD)
          echo "$merge_sha" > "$RUNNER_TEMP/merge/sha"
          if [[ "$merge_sha" != "$FORK_SHA" && "$merge_sha" != "$UPSTREAM_SHA" ]]; then
            git bundle create -q "$RUNNER_TEMP/merge/merge.bundle" HEAD "^$FORK_SHA" "^$UPSTREAM_SHA"
          fi

      - if: steps.due.outputs.due == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: merge
          path: ${{ runner.temp }}/merge
          if-no-files-found: error
          retention-days: 1

      # Upstream's nightly scheme (scripts/resolve-nightly-release.ts: next patch of the desktop
      # version), so the app's nightly channel takes these. The run number is offset so a fork
      # build sorts above an upstream nightly of the same day.
      - name: Resolve version
        if: steps.due.outputs.due == 'true'
        id: version
        env:
          RUN_STARTED_AT: ${{ github.run_started_at }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          base=$(node -p "require('./apps/desktop/package.json').version.replace(/[-+].*$/, '').split('.').map((part, index) => index === 2 ? Number(part) + 1 : part).join('.')")
          version="${base}-nightly.$(date -u -d "$RUN_STARTED_AT" +%Y%m%d).$((10000 + RUN_NUMBER))"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Version $version"

  # The watcher fails silently on Cloudflare (CPU limit, revoked token, outage). A scheduled run
  # that finds an upstream nightly over an hour old that the watcher never dispatched fails here,
  # and GitHub mails the owner; the build above still runs.
  watchdog:
    needs: prepare
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check that the watcher dispatched the newest upstream nightly
        env:
          UPSTREAM_TAG: ${{ needs.prepare.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          published=$(gh release view "$UPSTREAM_TAG" --repo pingdotgg/t3code --json publishedAt --jq .publishedAt)
          if (( $(date -u +%s) - $(date -u -d "$published" +%s) < 3600 )); then
            echo "$UPSTREAM_TAG is less than an hour old."
            exit 0
          fi
          last=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName // ""')
          body=""
          if [[ -n "$last" ]]; then
            body=$(gh release view "$last" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          fi
          if [[ "$body" == *"upstream-tag=$UPSTREAM_TAG "* ]]; then
            echo "$UPSTREAM_TAG is already released."
            exit 0
          fi
          dispatched=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow fork-release.yml \
            --event repository_dispatch --limit 20 --json displayTitle \
            --jq "[.[] | select(.displayTitle == \"Fork release of $UPSTREAM_TAG\")] | length")
          if (( dispatched > 0 )); then
            echo "The watcher dispatched $UPSTREAM_TAG."
            exit 0
          fi
          echo "::error::The Cloudflare watcher missed upstream $UPSTREAM_TAG (published $published). Check it with: npx wrangler tail (in fork/upstream-nightly-watcher)"
          exit 1

  # vp pack does not typecheck, so a type error would otherwise ship. Only the apps the desktop
  # build bundles; publish waits for this.
  typecheck:
    needs: prepare
    if: needs.prepare.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: merge
          path: ${{ runner.temp }}/merge

      - name: Check out the merge
        env:
          GIT_TERMINAL_PROMPT: "0"
          FORK_SHA: ${{ needs.prepare.outputs.fork_sha }}
          UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          merge="$RUNNER_TEMP/merge"
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git remote add upstream "$UPSTREAM_URL"
          git fetch -q --no-tags origin "$FORK_SHA"
          git fetch -q --no-tags upstream "$UPSTREAM_SHA"
          if [[ -f "$merge/merge.bundle" ]]; then
            git fetch -q --no-tags "$merge/merge.bundle"
          fi
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout -q --detach "$(cat "$merge/sha")"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Install dependencies
        timeout-minutes: 15
        run: vp install

      - name: Typecheck server, desktop and web
        run: |
          set -euo pipefail
          for app in server desktop web; do
            (cd "apps/$app" && vp run typecheck)
          done

  build:
    needs: prepare
    if: needs.prepare.outputs.due == 'true'
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        include:
          - label: Windows x64
            runner: windows-latest
            platform: win
            target: nsis
            assets: release/*.exe release/*.blockmap release/nightly.yml
          - label: Linux x64
            runner: ubuntu-latest
            platform: linux
            target: AppImage
            assets: release/*.AppImage release/nightly-linux.yml
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: merge
          path: ${{ runner.temp }}/merge

      - name: Check out the merge
        env:
          GIT_TERMINAL_PROMPT: "0"
          FORK_SHA: ${{ needs.prepare.outputs.fork_sha }}
          UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          merge="$RUNNER_TEMP/merge"
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git remote add upstream "$UPSTREAM_URL"
          git fetch -q --no-tags origin "$FORK_SHA"
          git fetch -q --no-tags upstream "$UPSTREAM_SHA"
          if [[ -f "$merge/merge.bundle" ]]; then
            git fetch -q --no-tags "$merge/merge.bundle"
          fi
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout -q --detach "$(cat "$merge/sha")"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Install dependencies
        timeout-minutes: 15
        run: vp install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'win' && 'x86_64-pc-windows-msvc' || 'x86_64-unknown-linux-gnu' }}

      - name: Install Linux desktop build libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsecret-1-dev pkg-config imagemagick

      # Upstream installs Spectre-mitigated MSVC libs first; only the build script's preflight
      # asks for them, and a reused monitor skips that check. The VS installer took minutes there.
      - name: Build resource monitor
        if: matrix.platform == 'win'
        timeout-minutes: 15
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Set package versions
        run: node scripts/update-release-package-versions.ts "$VERSION"

      # Unsigned, and without the WSL runtime upstream bundles from its Linux CLI build.
      # T3 Connect needs the public relay and Clerk values; they come from repository variables.
      - name: Build desktop artifact
        timeout-minutes: 45
        env:
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: ${{ matrix.platform == 'win' }}
          T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.T3CODE_CLERK_PUBLISHABLE_KEY }}
          T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.T3CODE_CLERK_JWT_TEMPLATE }}
          T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID }}
          T3CODE_RELAY_URL: ${{ vars.T3CODE_RELAY_URL }}
        run: |
          vp run dist:desktop:artifact \
            --platform ${{ matrix.platform }} --target ${{ matrix.target }} --arch x64 \
            --build-version "$VERSION" \
            --verbose

      - name: Collect release assets
        run: |
          set -euo pipefail
          ls -la release
          mkdir publish
          cp ${{ matrix.assets }} publish/
          feed=$(ls publish/*.yml)
          grep -q "version: $VERSION" "$feed"
          cat "$feed"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.platform }}
          path: publish/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # The tag goes on the fork branch's current head: pushing the merge itself would need
  # workflow-write rights, which GITHUB_TOKEN never has when upstream touched .github/workflows,
  # and GitHub refuses the same for a tag on an older fork commit whose workflows differ from the
  # head's (a fork commit pushed during the build). The release notes record what was built.
  publish:
    needs: [prepare, typecheck, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: publish
          merge-multiple: true

      - name: Publish release
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          FORK_SHA: ${{ needs.prepare.outputs.fork_sha }}
          UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream_sha }}
          UPSTREAM_TAG: ${{ needs.prepare.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          ls -la publish
          # Missing notes must not hold back a build; the marker alone still records it.
          marker="<!-- fork-release fork=$FORK_SHA upstream=$UPSTREAM_SHA upstream-tag=$UPSTREAM_TAG -->"
          previous=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName // ""')
          if ! { gh api "repos/$GITHUB_REPOSITORY/contents/fork/release-notes.sh?ref=$GITHUB_SHA" \
              -H "Accept: application/vnd.github.raw" > "$RUNNER_TEMP/release-notes.sh" &&
            notes=$(REPO="$GITHUB_REPOSITORY" TARGET="$FORK_SHA" PREVIOUS_TAG="$previous" \
              bash "$RUNNER_TEMP/release-notes.sh"); }; then
            echo "::warning::release notes failed; publishing without them"
            notes="$marker"
          fi
          gh release create "$TAG" publish/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$FORK_BRANCH" \
            --title "T3 Code Nightly $VERSION (fork)" \
            --notes "$notes" \
            --prerelease
